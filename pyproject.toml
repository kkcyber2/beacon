[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "1.0.0"
description = 'News ingestion pipeline — hand-rolled RSS/Atom parser, fingerprint dedupe, relevance scoring, SSE live feed.'
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "KK (Conan Sultan Khan)", email = "kkdev9715@gmail.com"}]
keywords = ["beacon"]

[project.urls]
Homepage = "https://github.com/kkcyber2/beacon"
Repository = "https://github.com/kkcyber2/beacon"

[tool.setuptools]
packages = ["beacon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
